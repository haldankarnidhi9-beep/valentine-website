<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💙</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(45deg, #b30000, #ff1a1a);
    color: white;
    text-align: center;
}

/* Intro */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12vw;
    color: red;
    animation: zoomIn 3s forwards;
}

@keyframes zoomIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1.2); opacity: 1; }
}

#mainContent, #proposal {
    display: none;
    padding-top: 15vh;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

#proposal {
    position: relative;
    height: 100vh;
}

#yes, #no {
    position: absolute;
}

#yes {
    background: #ff1744;
    left: 20%;
    top: 60%;
    box-shadow: 0 0 10px #ff1744;
}

#no {
    background: gray;
    left: 55%;
    top: 60%;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: white;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

#finalScreen {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #ff0000, #660000);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 6vw;
}
</style>
</head>

<body>

<div id="intro">HEY YOU 😏</div>

<div id="mainContent">
    <h1 id="rotatingText"></h1>
    <br>
    <button onclick="startProposal()">Open This 😌</button>
</div>

<div id="proposal">
    <h1 id="proposalText"></h1>
    <button id="yes" onclick="sayYes()">Yes 💙</button>
    <button id="no" ontouchstart="moveButton()" onmouseover="moveButton()">No 😢</button>
</div>

<div id="finalScreen">
    <h2 id="finalMessage"></h2>
</div>

<script>

let hisName = "Bhupesh (Shonu)";

// Rotating Titles
let titles = [
    "Will You Be My Forever Person? 💙",
    "Will You Be Mine? 💙",
    "Will You Be My Valentine Bestfriend ? 💙",
    "So… Are You Choosing Me? 😌",
    "Will You Be My Favorite Human? 💙"
];

let titleIndex = 0;

function rotateText() {
    document.getElementById("rotatingText").innerText = titles[titleIndex];
    titleIndex = (titleIndex + 1) % titles.length;
}
setInterval(rotateText, 2000);

// Show main after intro
setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    rotateText();
}, 3000);

function startProposal() {
    document.getElementById("mainContent").style.display = "none";
    document.getElementById("proposal").style.display = "block";
    document.getElementById("proposalText").innerText =
        hisName + ", are you choosing me? 😌💙";
}

let yesSize = 16;
let noSize = 16;
let glowSize = 10;

let messages = [
    "Are you sure bro? 😏",
    "Think properly 🤨",
    "Free food? 🍕",
    "Gym partner forever? 💪",
    "Don’t break my heart 😭",
    "Last chance mister 😌"
];

let messageIndex = 0;

function moveButton() {
    let noBtn = document.getElementById("no");
    let yesBtn = document.getElementById("yes");

    if (messageIndex < messages.length) {
        noBtn.innerText = messages[messageIndex++];
    } else {
        noBtn.innerText = "You can't escape 😏";
    }

    noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 120) + "px";

    yesSize += 4;
    yesBtn.style.fontSize = yesSize + "px";

    glowSize += 6;
    yesBtn.style.boxShadow =
        "0 0 " + glowSize + "px #ff1744, 0 0 " +
        (glowSize + 20) + "px white";

    noSize -= 2;
    if (noSize > 8) {
        noBtn.style.fontSize = noSize + "px";
    }
}

function sayYes() {
    document.getElementById("proposal").style.display = "none";
    document.getElementById("finalScreen").style.display = "flex";
    document.getElementById("finalMessage").innerText =
        "Okay fine " + hisName + "... you’re stuck with me now 😌💙";
    startConfetti();
}

// Floating hearts
function createHeart() {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 25 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 400);

// Confetti
function startConfetti() {
    for (let i = 0; i < 150; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "absolute";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.backgroundColor = randomColor();
        confetti.style.top = "-10px";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.transition = "top 3s linear";
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.style.top = window.innerHeight + "px";
        }, 10);

        setTimeout(() => confetti.remove(), 3000);
    }
}

function randomColor() {
    let colors = ["#ff0", "#0ff", "#f0f", "#0f0", "#f00", "#00f"];
    return colors[Math.floor(Math.random() * colors.length)];
}

</script>
</body>
</html>
